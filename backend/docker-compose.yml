version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: horus_tito_postgres
    environment:
      POSTGRES_DB: horus_tito_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - horus_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: horus_tito_backend
    environment:
      FLASK_ENV: development
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5000
      SECRET_KEY: dev-secret-key-change-in-production
      JWT_SECRET_KEY: jwt-secret-key-change-in-production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: horus_tito_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      CORS_ORIGINS: "*"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - horus_network
    command: python run.py

volumes:
  postgres_data:

networks:
  horus_network:
    driver: bridge
